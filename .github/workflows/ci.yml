name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    env:
      # ASan + UBSan on Linux Debug. (ASan is not run on macOS: its runtime
      # can hang during start-up on recent macOS releases.)
      SANITIZERS: ${{ matrix.os == 'ubuntu-latest' && matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Cache fetched C++ dependencies
        uses: actions/cache@v4
        with:
          path: .deps-cache
          key: deps-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DVEHICLESIM_WARNINGS_AS_ERRORS=ON
          -DVEHICLESIM_ENABLE_SANITIZERS=${{ env.SANITIZERS }}
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps-cache
          -DPython3_EXECUTABLE=$(command -v python)

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests (unit, CLI, scenario determinism, CSV validation)
        run: ctest --test-dir build --output-on-failure

      - name: Run scenarios, validate CSVs and generate plots
        env:
          PYTHON: python
        run: scripts/run_all.sh build output

      - name: Check generated artifacts
        run: |
          for name in acceleration constant_turn lane_change; do
            test -s "output/${name}.csv"
            for plot in trajectory speed heading lateral overview; do
              test -s "output/plots/${name}_${plot}.png"
            done
          done
          ls -l output output/plots

      - name: Upload telemetry and plots
        uses: actions/upload-artifact@v4
        with:
          name: simulation-output-${{ matrix.os }}-${{ matrix.build_type }}
          path: output/
          retention-days: 14

  docker:
    name: docker / build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: vehiclesim-test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run test suite in container
        run: docker run --rm vehiclesim-test

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: vehiclesim
          load: true
          cache-from: type=gha

      - name: Run a scenario in the runtime image
        run: |
          mkdir -p output && chmod 777 output
          docker run --rm -v "$PWD/output:/output" vehiclesim scenarios/lane_change.json -o /output/lane_change.csv
          python3 scripts/validate_csv.py output/lane_change.csv --scenario scenarios/lane_change.json
